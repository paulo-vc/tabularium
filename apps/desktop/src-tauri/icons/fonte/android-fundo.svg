<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Camada de fundo do ícone do Android: o azul-tinta com o brilho, sem cantos (o aparelho aplica o próprio corte). -->
  <defs>
    <radialGradient id="brilho" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#5b86ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5b86ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0b1124"/>
  <rect width="512" height="512" fill="url(#brilho)"/>
</svg>
