      <stop offset="1" stop-color="#9c7a1f"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#ouro)" stroke-linejoin="round" stroke-linecap="round" transform="translate(256 256) scale(0.86) translate(-256 -256)">
